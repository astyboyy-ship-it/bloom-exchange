# Fly.io deployment for relay.bloomexchange.ai. From the repository root:
#   fly deploy . --config apps/relay/fly.toml --dockerfile apps/relay/Dockerfile
# (the build context must be the repository root: the relay builds the schemas and sdk workspaces too)
#   fly secrets set DATABASE_URL=... UPSTASH_REDIS_REST_URL=... UPSTASH_REDIS_REST_TOKEN=...
#
# Live WebSocket/SSE fan-out is per process today, so run one machine (scale count 1) until fan-out moves to
# Redis pub/sub. State, the ledger and replay protection are already shared through Postgres and Redis.
app = "bloom-relay"
primary_region = "fra"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  RELAY_PUBLIC_URL = "https://relay.bloomexchange.ai"
  VERIFIER_URL = "https://verify.bloomexchange.ai"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
