# Bloom Exchange node on Kubernetes
#   1. npm run sovereign:init   (then copy the values from deploy/.env into secret.yaml, or project them from your secret manager)
#   2. docker build -f deploy/Dockerfile -t <registry>/bloom-exchange-node:0.2.0 . && docker push it; set `images` below
#   3. kubectl apply -k deploy/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bloom-exchange
resources:
  - namespace.yaml
  - secret.yaml
  - data-plane.yaml
  - exchange.yaml
  - network-policy.yaml
images:
  - name: bloom-exchange-node
    newName: registry.internal.example/bloom/exchange-node
    newTag: "0.2.0"