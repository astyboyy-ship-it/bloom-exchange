# Redis (persistence) and its Upstash-compatible REST gateway. Internal services only.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis, tier: data }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
          ports: [{ containerPort: 6379 }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          readinessProbe: { exec: { command: ["redis-cli", "ping"] }, periodSeconds: 5 }
          volumeMounts: [{ name: data, mountPath: /data }]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: ["ReadWriteOnce"], resources: { requests: { storage: 10Gi } } }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srh
spec:
  replicas: 1
  selector:
    matchLabels: { app: srh }
  template:
    metadata:
      labels: { app: srh, tier: data }
    spec:
      containers:
        - name: srh
          # Pin to a reviewed tag for production.
          image: hiett/serverless-redis-http:latest
          env:
            - { name: SRH_MODE, value: env }
            - { name: SRH_CONNECTION_STRING, value: "redis://redis:6379" }
            - name: SRH_TOKEN
              valueFrom: { secretKeyRef: { name: bloom-node-secrets, key: SRH_TOKEN } }
          ports: [{ containerPort: 80 }]
          securityContext: { allowPrivilegeEscalation: false }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: srh
spec:
  selector: { app: srh }
  ports: [{ port: 80, targetPort: 80 }]
